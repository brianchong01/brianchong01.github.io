  <head>
    <meta charset="UTF-8" />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Outfit:wght@800;900&display=swap"

    />

      sizes="180x180"
      href="/assets/apple-touch-icon-DnlblOQj.png"
    />
    <link

      type="image/png"
      sizes="32x32"

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              manrope: ["Manrope", "sans-serif"],
              outfit: ["Outfit", "sans-serif"],
            },
            colors: {
              figma: {
                purple: "#B794F4", // Muted Pastel Purple
                green: "#8BCFA2", // Muted Pastel Green (10% darker)
                blue: "#90CDF4", // Muted Pastel Blue
                orange: "#FBD38D", // Muted Pastel Orange
                pink: "#FBB6CE", // Muted Pastel Pink
              },
            },
            animation: {
              "fade-in": "fadeIn 1s ease-out forwards",
              "slide-up": "slideUp 0.8s ease-out forwards",
              float: "float 6s ease-in-out infinite",
              blob: "blob 15s infinite alternate ease-in-out",
              "blob-fast": "blobFast 10s infinite alternate ease-in-out",
              drop: "drop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(30px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-20px)" },
              },
              blob: {
                "0%": {
                  transform: "translate(0px, 0px) scale(1) rotate(0deg)",
                },
                "33%": {
                  transform: "translate(80px, -120px) scale(1.1) rotate(10deg)",
                },
                "66%": {
                  transform: "translate(-80px, 80px) scale(0.9) rotate(-10deg)",
                },
                "100%": {
                  transform: "translate(40px, -40px) scale(1.05) rotate(5deg)",
                },
              },
              blobFast: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "50%": { transform: "translate(-100px, 60px) scale(1.1)" },
                "100%": { transform: "translate(100px, -60px) scale(0.95)" },
              },
              drop: {
                "0%": {
                  transform: "translateY(-200%) rotate(-20deg)",
                  opacity: "0",
                },
                "100%": { transform: "translateY(0) rotate(0)", opacity: "1" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Manrope", sans-serif;
        scroll-behavior: smooth;
      }
      .bg-craft {
        background-color: #f7f3ed;
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      }
      .dark .bg-craft {
        background-color: #1a1a1a;
        background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
      }
      .glass {
        background: rgba(247, 243, 237, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass {
        background: rgba(26, 26, 26, 0.7);
      }
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      .figma-shape {
        filter: blur(60px);
        opacity: 0.4;
      }
      /* Custom selection to match pastel theme */
      ::selection {
        background-color: #d4b3ff;
        color: #1a1a1a;
      }
    </style>

    <link rel="stylesheet" href="/index.css" />

      {

        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CqHkZl0e.js"></script>
  </head>
  <body
    class="bg-craft text-slate-900 dark:text-slate-100 transition-colors duration-300 overflow-x-hidden"
  >
    <div id="root"></div>
  </body>
</html>
